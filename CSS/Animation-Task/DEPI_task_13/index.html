<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Ceramic Mug</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- start main home section -->

    <main class="main-home">

        <div class="product-card">

            <div class="img-wrapper">

                <img src="img/mug1.png" class="product-img" alt="Handmade green mug">

            </div>

            <div class="card-content">

                <span class="badge">HANDMADE CERAMIC</span>
                <h2 class="title">Earthy Clay Mug</h2>
                <p class="description">Crafted slowly by hand with natural terracotta clay for your quiet coffee moments.</p>

                <div class="card-footer">

                    <span class="price">$32.00</span>
                    <button class="buy-btn">Add to Cart</button>

                </div>

            </div>

        </div>

    </main>

    <!-- end main home section -->

</body>
</html>
