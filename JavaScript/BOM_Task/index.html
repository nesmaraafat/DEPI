<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="deleteAlert" class="alert theme-danger w-50 m-auto my-5 d-none" role="alert">
        <p>Task deleted successfully!</p>
    </div>


    <div class="container my-12">
        <div class="row">
            <div class="md:col-10 m-auto">

                <h3 class="text-center">To Do List</h3>

                <form id="myForm">
                    <input id="tasks" type="text" name="tasks" placeholder="Enter your tasks" class="form-control my-5">
                    <input type="submit" value="add task" class="btn-solid theme-success form-control">
                </form>

                <ul id="taskList" class="mt-5">

                </ul>

            </div>
        </div>
    </div>

    





    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
