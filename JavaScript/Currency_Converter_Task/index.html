<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <!-- bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- style CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    

    <div class="container mt-12 pt-12">
        <div class="row">
            <div class="md:col-10 m-auto">

                <h2 class="text-center mt-10">Convert Dollar To Egyptian Pound</h2>
                <form id="myForm">
                    <input id="dollar" type="text" class="form-control my-8" placeholder="Enter Amount of Dollars">
                    <input type="submit" value="Convert" class="btn-solid theme-accent d-block w-100 fw-semibold fs-lg mb-6">
                </form>
                <h5 id="result"></h5>

            </div>
        </div>
    </div>


    
    <!-- bootstrap js -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- main js -->
    <script src="js/main.js"></script>
</body>
</html>
